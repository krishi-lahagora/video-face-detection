<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            margin: 0;
            padding: 4px 0;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .btn-detect {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #db2777 100%);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 15px 36px;
            font-size: 1.02rem;
            font-weight: 800;
            border-radius: 9999px;
            cursor: pointer;
            box-shadow: 0 4px 25px rgba(124, 58, 237, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.3);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            max-width: 480px;
            justify-content: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }
        .btn-detect:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 35px rgba(219, 39, 119, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.5);
            background: linear-gradient(135deg, #6366f1 0%, #9333ea 50%, #ec4899 100%);
        }
        .btn-detect:active {
            transform: translateY(1px) scale(0.99);
        }
        .scan-dot {
            width: 10px;
            height: 10px;
            background: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 10px #22c55e;
            animation: pulse-dot 1.8s infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }
    </style>
</head>
<body>
    <button class="btn-detect" id="captureBtn" onclick="onCaptureClick()">
        <span class="scan-dot"></span>
        <span style="font-size: 1.25rem;">🎯</span>
        <span>Detect from Currently Paused Frame</span>
    </button>

    <script>
        function sendMessageToStreamlit(type, data) {
            window.parent.postMessage(Object.assign({
                isStreamlitMessage: true,
                type: type
            }, data || {}), "*");
        }

        function setComponentReady() {
            sendMessageToStreamlit("streamlit:componentReady", { apiVersion: 1 });
        }

        function setFrameHeight(h) {
            const desiredHeight = h || Math.max(84, document.body.scrollHeight || 84);
            sendMessageToStreamlit("streamlit:setFrameHeight", { height: desiredHeight });
        }

        function setComponentValue(val) {
            sendMessageToStreamlit("streamlit:setComponentValue", { value: val });
        }

        window.addEventListener("DOMContentLoaded", function() {
            setComponentReady();
            setFrameHeight(84);
        });

        window.addEventListener("message", function(e) {
            if (e.data && e.data.type === "streamlit:render") {
                setFrameHeight(84);
            }
        });


        function onCaptureClick() {
            let pausedTime = 0.0;
            let base64Img = "";
            let foundVideo = false;

            try {
                let videos = window.parent.document.querySelectorAll("video");
                if (videos && videos.length > 0) {
                    let vid = videos[0];
                    for (let i = 0; i < videos.length; i++) {
                        if (videos[i].currentTime > 0) {
                            vid = videos[i];
                            break;
                        }
                    }
                    foundVideo = true;
                    pausedTime = vid.currentTime || 0.0;
                    vid.pause();

                    try {
                        let canvas = document.createElement("canvas");
                        canvas.width = vid.videoWidth || 640;
                        canvas.height = vid.videoHeight || 360;
                        let ctx = canvas.getContext("2d");
                        ctx.drawImage(vid, 0, 0, canvas.width, canvas.height);
                        base64Img = canvas.toDataURL("image/jpeg", 0.92);
                    } catch (canvasErr) {
                        console.log("Canvas snapshot note:", canvasErr);
                    }
                }
            } catch (err) {
                console.warn("Parent video query error:", err);
            }

            setComponentValue({
                timestamp: pausedTime,
                image_base64: base64Img,
                found_video: foundVideo,
                nonce: Date.now()
            });
        }
    </script>
</body>
</html>
